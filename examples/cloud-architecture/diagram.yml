# yaml-language-server: $schema=../../schema/diagr.schema.json
version: 1
id: cloud-architecture
title: Job pipeline
description: >-
  The API admits jobs into a fair backlog. A dispatcher releases them to the jobs queue, where workers pick them up;
  jobs that keep failing move to a dead-letter queue and can be redriven.
grid: { col: 182, row: 175 }
step_list: false

nodes:
  api: { at: [0, 1], icon: function, title: API, sub: admission }
  backlog: { at: [1, 1], icon: database, title: Backlog, sub: fair order }
  tick: { at: [2, 0], icon: clock, title: Scheduler, sub: every minute }
  dispatcher: { at: [2, 1], icon: function, title: Dispatcher }
  jobs: { at: [3, 0], icon: queue, title: Jobs queue }
  transcode: { at: [4, 0], icon: server, title: Transcode workers, sub: pull one job at a time, stack: 3 }
  dlq: { at: [4, 1], icon: queue, title: Dead letters }
  cq: { at: [3, 2], icon: queue, title: Captions queue }
  captions: { at: [4, 2], icon: server, title: Captions workers, sub: speech to text }
  llm: { at: [5, 2], icon: globe, title: Model API, sub: classification }

edges:
  api -> backlog -> dispatcher: [admit, release fairly]
  tick --> dispatcher:
  api --> dispatcher as wake: { label: wake, route: [up 0.4, right, down] }
  dispatcher -> jobs: { label: send, route: [right 70px, up, right] }
  jobs -> transcode:
  transcode -> dlq: bad source, deadline
  jobs@bottom+15 -> dlq: { label: three failures, route: [down, right] }
  dlq --> jobs@bottom-15 as redrive: { label: make redrive, route: [right 0.45, down 0.45, left, up] }
  api -> cq: { label: captions job, route: [down, right] }
  cq -> captions:
  captions -> llm: transcript

scenarios:
  job:
    ready: Follow one job from admission to a dead-letter queue and back.
    end: The job is back on the queue.
    steps:
      - title: Admit
        text: The API admits the job to the backlog and, at the same time, sends its captions job down the captions pipeline.
        do:
          - parallel: [flow api 600ms -> backlog, flow api -> cq -> captions -> llm done]
          - activate backlog 600ms
      - Dispatch: [flow backlog -> dispatcher 600ms -> jobs]
      - title: Fail three times
        do:
          - activate jobs
          - draw jobs->transcode 800ms
          - repeat 3:
              - activate transcode 1000ms
              - fail transcode
              - transcode.sub 800ms: attempt {i} of 3 failed
          - draw jobs->dlq
          - activate dlq 800ms
          - done jobs
      - Redrive: [draw redrive 1800ms, done dlq, status: An operator redrove the job., wait 1200ms]
