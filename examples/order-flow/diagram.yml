# yaml-language-server: $schema=../../schema/diagr.schema.json
id: order-flow
title: Order processing
description: A web app posts an order to the API, which queues it for workers that write it to the orders database.
grid: {col: 200, row: 170}

groups:
  front:
    title: Frontend
    tone: blue
    nodes:
      web: {at: [0, 0], icon: browser, title: Web app, sub: checkout page}
  back:
    title: Backend
    sub: one region
    tone: teal
    nodes:
      api: {at: [1, 0], icon: function, title: API, sub: validates}
      queue: {at: [2, 0], icon: queue, title: Order queue}
      worker: {at: [3, 0], icon: server, title: Workers, sub: three replicas, stack: 3}
      db: {at: [3, 1], icon: database, title: Orders}
      dlq: {at: [2, 1], icon: queue, title: Dead letters, sub: kept for 14 days, mark: new}
      mail: {at: [4, 0], icon: mail, title: Email, sub: confirmation, hidden: true}

edges:
  web -> api -> queue -> worker -> db: [POST /orders, enqueue, deliver, write]
  queue --> dlq: after 3 tries
  worker -> mail: {label: notify, hidden: true}

scenarios:
  order:
    loop: true
    trigger: {at: web, label: Place order}
    ready: One order, from checkout to confirmation.
    end: Order stored and confirmed.
    steps:
      - title: Submit
        at: web
        text: The customer places the order from the checkout page.
        do: [flow web 600ms -> api]
      - title: Validate and queue
        at: api
        text: The API checks the order and puts it on the queue, so a slow worker never blocks checkout.
        do: [activate api 800ms, api.sub: order is valid, flow api -> queue]
      - title: Process
        at: worker
        text: A worker takes the order off the queue and writes it to the database.
        do: [flow queue -> worker 1200ms -> db 600ms done]
      - title: Confirm
        at: mail
        text: Once the order is stored, the worker sends the confirmation email.
        # Drawing the hidden edge brings it and the email node out.
        focus: [worker, mail]
        do: [draw worker->mail, run mail 1000ms]
