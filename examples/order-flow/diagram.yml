# yaml-language-server: $schema=../../schema/diagr.schema.json
diagr: 1
id: order-flow
title: Order processing
description: A web app posts an order to the API, which queues it for workers that write it to the orders database.
grid: {col: 200, row: 170}

groups:
  front: {title: Frontend, tone: blue}
  back: {title: Backend, sub: one region, tone: teal}

nodes:
  web: {in: front, at: [0, 0], icon: browser, title: Web app, sub: checkout page, trigger: Place order}
  api: {in: back, at: [1, 0], icon: function, title: API, sub: validates}
  queue: {in: back, at: [2, 0], icon: queue, title: Order queue}
  worker: {in: back, at: [3, 0], icon: server, title: Workers, sub: three replicas, stack: 3}
  db: {in: back, at: [3, 1], icon: database, title: Orders}
  dlq: {in: back, at: [2, 1], icon: queue, title: Dead letters, sub: kept for 14 days, mark: new}
  mail: {in: back, at: [4, 0], icon: mail, title: Email, sub: confirmation, hidden: true}

edges:
  web -> api: POST /orders
  api -> queue: enqueue
  queue -> worker: deliver
  worker -> db: write
  queue -> dlq: {label: after 3 tries, dashed: true}
  worker -> mail: {label: notify, hidden: true}

scenario:
  ready: Press Place order to follow one order.
  end: Order stored and confirmed.
  steps:
    - title: Submit
      at: web
      text: The customer places the order from the checkout page.
      do: [flow web -> api 300ms]
    - title: Validate and queue
      at: api
      text: The API checks the order and puts it on the queue, so a slow worker never blocks checkout.
      do: [activate api 400ms, "set api.sub: order is valid", draw api->queue, done api]
    - title: Process
      at: worker
      text: A worker takes the order off the queue and writes it to the database.
      do:
        - activate queue
        - draw queue->worker
        - done queue
        - activate worker 600ms
        - draw worker->db
        - activate db 300ms
        - done worker db
    - title: Confirm
      at: mail
      text: Once the order is stored, the worker sends the confirmation email.
      do:
        - show mail worker->mail
        - focus worker mail worker->mail
        - draw worker->mail
        - activate mail 500ms
        - done mail
        - focus none
