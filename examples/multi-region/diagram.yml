# yaml-language-server: $schema=../../schema/diagr.schema.json
diagr: 1
diagram: multi-region
title: Multi-region platform
description: >-
  A global load balancer sends traffic to region A, with region B on standby. Each region runs a cluster of
  services and its own database, kept in sync by replication. Three scenarios: a checkout request, a region
  failover and a rolling deploy.
grid: {col: 200, row: 150}

# One region, defined once. Its cells are relative: [0, 0] is the checkout API.
components:
  region:
    params: {name: , role: primary, database: primary}
    groups:
      region: {title: "{name}", sub: "{role}", tone: neutral}
      cluster: {title: Cluster, in: region, tone: blue}
      checkout: {title: Checkout, in: cluster, tone: teal}
      catalog: {title: Catalog, in: cluster, tone: violet}
      data: {title: Data, in: region, tone: amber}
    nodes:
      api: {in: checkout, at: [0, 0], icon: api, title: Checkout API}
      worker: {in: checkout, at: [1, 0], icon: server, title: Workers, sub: v1, stack: 2}
      prices: {in: catalog, at: [2, 0], icon: function, title: Pricing}
      db: {in: data, at: [3, 0], icon: database, title: Orders, sub: "{database}"}
    edges:
      api -> worker: jobs
      api -> prices: {label: prices, route: [up 40px, right, down]}
      worker -> db@bottom-16: {label: write, route: [down 56px, right, up]}

# Two copies. Their nodes are a/api, a/worker, ... and b/api, b/worker, ...
place:
  a: {component: region, at: [2.2, 0], with: {name: Region A}}
  b: {component: region, at: [2.2, 2.4], with: {name: Region B, role: standby, database: replica}}

groups:
  edge: {title: Global edge, tone: neutral}
  delivery: {title: Delivery, tone: green}

nodes:
  health: {at: [0, 0], icon: clock, title: Health checks, sub: every 10 s, trigger: Fail region A, plays: failover}
  user: {at: [0, 1.2], icon: browser, title: Customer, trigger: Place order, plays: checkout}
  lb: {in: edge, at: [1, 1.2], icon: globe, title: Load balancer, sub: anycast}
  ci: {in: delivery, at: [6.4, 1.2], icon: pipeline, title: Deploy pipeline, cells: [build, test, canary, rollout], trigger: Deploy, plays: deploy}

edges:
  user -> lb: HTTPS
  health -> a/api@left-12: {label: probe, dashed: true}
  lb -> a/api@left+12: {label: active, route: [right 0.39, up, right]}
  lb -> b/api@left: {label: standby, route: [right 0.39, down, right], dashed: true}
  a/db@bottom+16 -> b/db@top+16: {label: replication, dashed: true}
  ci -> a/worker: {label: rollout, route: [up, left, down 130px], hidden: true}
  ci -> b/worker: {label: canary, route: [down, left, up 130px], hidden: true}

scenarios:
  checkout:
    title: Checkout request
    ready: Press Place order to follow one request.
    end: Order stored in region A and replicated to B.
    steps:
      - title: Request
        at: user
        text: The customer's browser sends the order to the global load balancer.
        do: [flow user -> lb]
      - title: Route to region A
        at: lb
        text: Region A is active, so the load balancer sends the request there.
        do: [flow lb -> a/api 300ms]
      - title: Price and accept
        at: a/api
        text: The checkout API asks the pricing service for the total, then queues the order for the workers.
        do:
          - activate a/api
          - parallel: [draw a/api->a/prices, activate a/prices]
          - done a/prices
          - draw a/api->a/worker
          - done a/api
      - title: Persist
        at: a/worker
        text: A worker writes the order to the primary database.
        do: [flow a/worker -> a/db 400ms, activate a/db 300ms, done a/db]
      - title: Replicate
        at: b/db
        text: The write is replicated to region B, which stays ready to take over.
        do: [draw a/db->b/db, "set b/db.sub: replica, in sync", done b/db]

  failover:
    title: Region failover
    ready: Press Fail region A to see the standby region take over.
    end: Region B serves all traffic.
    steps:
      - title: Probe fails
        at: health
        text: The health check stops getting answers from region A.
        do: [activate health, draw health->a/api, fail a/api, fail a/worker, "set health.sub: region A down"]
      - title: Drain region A
        at: lb
        text: The load balancer stops sending traffic to region A.
        do: [focus lb a/api a/worker, hide lb->a/api, "set lb.sub: draining A", wait 600ms, focus none]
      - title: Promote the replica
        at: b/db
        text: Region B's database is promoted from replica to primary.
        do: [activate b/db 600ms, "set b/db.sub: primary", done b/db]
      - title: Reroute
        at: b/api
        text: All traffic now goes to region B.
        do:
          - draw lb->b/api
          - "set lb->b/api.label: all traffic"
          - "set lb.sub: anycast, to B"
          - activate b/api
          - draw b/api->b/worker
          - draw b/worker->b/db
          - done b/api b/worker health

  deploy:
    title: Rolling deploy
    ready: Press Deploy to roll a new version out, region B first.
    end: Both regions run v2.
    steps:
      - title: Build and test
        at: ci
        text: The pipeline builds the new version and runs the tests.
        do: [activate ci, cells ci 1..2]
      - title: Canary in region B
        at: b/worker
        text: The standby region gets the new version first, as a canary with no customer traffic.
        do:
          - show ci->b/worker
          - draw ci->b/worker
          - cells ci 3..3
          - activate b/worker 500ms
          - "set b/worker.sub: v2 canary"
          - done b/worker
      - title: Roll out to region A
        at: a/worker
        text: Region A is updated one replica at a time, so it keeps serving during the rollout.
        do:
          - show ci->a/worker
          - draw ci->a/worker
          - cells ci 4..4
          - activate a/worker
          - repeat: 2
            do: ["set a/worker.sub: replica {i} of 2 on v2", wait 500ms]
          - "set a/worker.sub: v2"
          - "set b/worker.sub: v2"
          - done a/worker ci
