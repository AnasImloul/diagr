<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115.5 -140 1503.3 673.6" width="1503.3" height="673.6" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="event-driven-light-title" aria-describedby="event-driven-light-desc">
<title id="event-driven-light-title">Event-driven shop</title>
<desc id="event-driven-light-desc">Phone and web clients call one gateway. The orders service stores each order and publishes an event, and three consumers react to it on their own: stock, search and notifications.</desc>
<defs><linearGradient id="tile-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9970a"/><stop offset="1" stop-color="#f2c811"/></linearGradient><linearGradient id="tile-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a5cb8"/><stop offset="1" stop-color="#2e8bf0"/></linearGradient><linearGradient id="tile-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b42318"/><stop offset="1" stop-color="#ef4444"/></linearGradient><linearGradient id="tile-slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#94a3b8"/></linearGradient><linearGradient id="tile-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f7b6c"/><stop offset="1" stop-color="#2bb59a"/></linearGradient><linearGradient id="tile-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3fc4"/><stop offset="1" stop-color="#a07be8"/></linearGradient></defs>
