eight="64" rx="10" fill="url(#tile-amber)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42V30a12 12 0 0 1 24 0v12l4 5H16z"/><path d="M28 51a4 4 0 0 0 8 0"/></g></g><text class="ntitle" x="1191.1" y="305.2" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Notifications</text></g><g class="node" id="n-gateway" data-id="gateway"><g class="tile" transform="translate(214.8 103.6) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 50V26l18-12 18 12v24"/><path d="M22 38h20M36 32l6 6-6 6"/></g></g><text class="ntitle" x="240.8" y="175.6" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">API gateway</text><text class="nsub" x="240.8" y="191.6" font-size="12" text-anchor="middle" fill="#656d76">auth, rate limits</text></g><g class="node" id="n-bus" data-id="bus"><g class="tile" transform="translate(939.35 103.6) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h44"/><path d="M18 18v14M32 18v14M46 18v14M25 46V32M39 46V32"/><circle cx="18" cy="16" r="3"/><circle cx="32" cy="16" r="3"/><circle cx="46" cy="16" r="3"/><circle cx="25" cy="48" r="3"/><circle cx="39" cy="48" r="3"/></g></g><text class="ntitle" x="965.35" y="175.6" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Event bus</text><text class="nsub" x="965.35" y="191.6" font-size="12" text-anchor="middle" fill="#656d76">order.placed</text></g><g class="node" id="n-monitor" data-id="monitor"><g class="tile" transform="translate(939.35 271.6) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="40" height="28" rx="3"/><path d="M26 50h12M32 42v8"/><path d="M18 31h6l4-7 6 12 4-5h8"/></g></g><text class="ntitle" x="965.35" y="343.6" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Monitoring</text><text class="nsub" x="965.35" y="359.6" font-size="12" text-anchor="middle" fill="#656d76">traces and alerts</text></g></g>
<line x1="-95.5" y1="383.6" x2="1367.8" y2="383.6" stroke-width="1.5" stroke="#d0d7de"/>
<circle cx="-85.5" cy="413.6" r="10" fill="#1f2328"/>
<text x="-85.5" y="417.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="-65.5" y="417.6" font-size="14" font-weight="600" fill="#1f2328">Call the gateway</text>
<text x="-65.5" y="436.6" font-size="12.5" fill="#656d76">The phone app sends the order to the API gateway, which checks the token.</text>
<circle cx="-85.5" cy="471.6" r="10" fill="#1f2328"/>
<text x="-85.5" y="475.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="-65.5" y="475.6" font-size="14" font-weight="600" fill="#1f2328">Store the order</text>
<text x="-65.5" y="494.6" font-size="12.5" fill="#656d76">The orders service reads the session from the cache and writes the order.</text>
<circle cx="666.15" cy="413.6" r="10" fill="#1f2328"/>
<text x="666.15" y="417.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="686.15" y="417.6" font-size="14" font-weight="600" fill="#1f2328">Publish</text>
<text x="686.15" y="436.6" font-size="12.5" fill="#656d76">One event goes on the bus. The orders service is done; it does not wait for anyone.</text>
<circle cx="666.15" cy="471.6" r="10" fill="#1f2328"/>
<text x="666.15" y="475.4" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<text x="686.15" y="475.6" font-size="14" font-weight="600" fill="#1f2328">React</text>
<text x="686.15" y="494.6" font-size="12.5" fill="#656d76">Each consumer picks the event up on its own.</text>
</svg>
