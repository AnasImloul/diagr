<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115.5 -140 1479.65 669.2" width="1479.65" height="669.2" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="event-driven-order-flow-dark-title" aria-describedby="event-driven-order-flow-dark-desc">
<title id="event-driven-order-flow-dark-title">One order</title>
<desc id="event-driven-order-flow-dark-desc">Phone and web clients call one gateway. The orders service stores each order and publishes an event, and three consumers react to it on their own: stock, search and notifications.</desc>
