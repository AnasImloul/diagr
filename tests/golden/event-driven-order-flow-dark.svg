)"><rect width="64" height="64" rx="10" fill="url(#tile-slate)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="12"/><path d="M37 37l13 13"/></g></g><text class="ntitle" x="1167.45" y="175.6" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Search index</text></g><g class="node" id="n-notify" data-id="notify"><g class="tile" transform="translate(1141.45 233.2) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-amber)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42V30a12 12 0 0 1 24 0v12l4 5H16z"/><path d="M28 51a4 4 0 0 0 8 0"/></g></g><text class="ntitle" x="1167.45" y="305.2" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Notifications</text></g><g class="node" id="n-gateway" data-id="gateway"><g class="tile" transform="translate(214.8 103.6) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 50V26l18-12 18 12v24"/><path d="M22 38h20M36 32l6 6-6 6"/></g></g><text class="ntitle" x="240.8" y="175.6" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">API gateway</text><text class="nsub" x="240.8" y="191.6" font-size="12" text-anchor="middle" fill="#8d96a0">auth, rate limits</text></g><g class="node" id="n-bus" data-id="bus"><g class="tile" transform="translate(926.45 103.6) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h44"/><path d="M18 18v14M32 18v14M46 18v14M25 46V32M39 46V32"/><circle cx="18" cy="16" r="3"/><circle cx="32" cy="16" r="3"/><circle cx="46" cy="16" r="3"/><circle cx="25" cy="48" r="3"/><circle cx="39" cy="48" r="3"/></g></g><text class="ntitle" x="952.45" y="175.6" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Event bus</text><text class="nsub" x="952.45" y="191.6" font-size="12" text-anchor="middle" fill="#8d96a0">order.placed</text></g></g>
<line x1="-95.5" y1="379.2" x2="1344.15" y2="379.2" stroke-width="1.5" stroke="#30363d"/>
<circle cx="-85.5" cy="409.2" r="10" fill="#e6edf3"/>
<text x="-85.5" y="413" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text>
<text x="-65.5" y="413.2" font-size="14" font-weight="600" fill="#e6edf3">Call the gateway</text>
<text x="-65.5" y="432.2" font-size="12.5" fill="#8d96a0">The phone app sends the order to the API gateway, which checks the token.</text>
<circle cx="-85.5" cy="467.2" r="10" fill="#e6edf3"/>
<text x="-85.5" y="471" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">2</text>
<text x="-65.5" y="471.2" font-size="14" font-weight="600" fill="#e6edf3">Store the order</text>
<text x="-65.5" y="490.2" font-size="12.5" fill="#8d96a0">The orders service reads the session from the cache and writes the order.</text>
<circle cx="654.33" cy="409.2" r="10" fill="#e6edf3"/>
<text x="654.33" y="413" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">3</text>
<text x="674.33" y="413.2" font-size="14" font-weight="600" fill="#e6edf3">Publish</text>
<text x="674.33" y="432.2" font-size="12.5" fill="#8d96a0">One event goes on the bus. The orders service is done; it does not wait for anyone.</text>
<circle cx="654.33" cy="467.2" r="10" fill="#e6edf3"/>
<text x="654.33" y="471" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">4</text>
<text x="674.33" y="471.2" font-size="14" font-weight="600" fill="#e6edf3">React</text>
<text x="674.33" y="490.2" font-size="12.5" fill="#8d96a0">Each consumer picks the event up on its own.</text>
</svg>
