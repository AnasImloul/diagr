<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -147 646 811" width="646" height="811" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="data-platform-ingestion-light-title" aria-describedby="data-platform-ingestion-light-desc">
<title id="data-platform-ingestion-light-title">Ingestion</title>
<desc id="data-platform-ingestion-light-desc">Three source feeds are ingested, validated and merged into a lakehouse, where a batch engine cleans and curates the data through bronze, silver and gold zones before a warehouse serves it to dashboards and an API. Four scenarios: the nightly batch, a bad record, a self-serve query and a backfill.</desc>
