="64" height="64" rx="10" fill="url(#tile-amber)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42V30a12 12 0 0 1 24 0v12l4 5H16z"/><path d="M28 51a4 4 0 0 0 8 0"/></g></g><text class="ntitle" x="1053.5" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Notifications</text></g><g class="node" id="n-gateway" data-id="gateway"><g class="tile" transform="translate(253.5 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 50V26l18-12 18 12v24"/><path d="M22 38h20M36 32l6 6-6 6"/></g></g><text class="ntitle" x="279.5" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">API gateway</text><text class="nsub" x="279.5" y="62" font-size="12" text-anchor="middle" fill="#656d76">auth, rate limits</text></g><g class="node" id="n-bus" data-id="bus"><g class="tile" transform="translate(748 294) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h44"/><path d="M18 18v14M32 18v14M46 18v14M25 46V32M39 46V32"/><circle cx="18" cy="16" r="3"/><circle cx="32" cy="16" r="3"/><circle cx="46" cy="16" r="3"/><circle cx="25" cy="48" r="3"/><circle cx="39" cy="48" r="3"/></g></g><text class="ntitle" x="774" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Event bus</text><text class="nsub" x="774" y="382" font-size="12" text-anchor="middle" fill="#656d76">order.placed</text></g></g>
<line x1="-95.5" y1="440" x2="1230.2" y2="440" stroke-width="1.5" stroke="#d0d7de"/>
<circle cx="-85.5" cy="470" r="10" fill="#1f2328"/>
<text x="-85.5" y="473.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="-65.5" y="474" font-size="14" font-weight="600" fill="#1f2328">Call the gateway</text>
<text x="-65.5" y="493" font-size="12.5" fill="#656d76">The phone app sends the order to the API gateway, which checks the token.</text>
<circle cx="-85.5" cy="528" r="10" fill="#1f2328"/>
<text x="-85.5" y="531.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="-65.5" y="532" font-size="14" font-weight="600" fill="#1f2328">Store the order</text>
<text x="-65.5" y="551" font-size="12.5" fill="#656d76">The orders service reads the session from the cache and writes the order.</text>
<circle cx="597.35" cy="470" r="10" fill="#1f2328"/>
<text x="597.35" y="473.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="617.35" y="474" font-size="14" font-weight="600" fill="#1f2328">Publish</text>
<text x="617.35" y="493" font-size="12.5" fill="#656d76">One event goes on the bus. The orders service is done; it does not wait for anyone.</text>
<circle cx="597.35" cy="528" r="10" fill="#1f2328"/>
<text x="597.35" y="531.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<text x="617.35" y="532" font-size="14" font-weight="600" fill="#1f2328">React</text>
<text x="617.35" y="551" font-size="12.5" fill="#656d76">Each consumer picks the event up on its own.</text>
</svg>
