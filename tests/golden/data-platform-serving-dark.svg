 16 14"/></g></g><text class="ntitle" x="708" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Analyst</text><text class="nsub" x="708" y="62" font-size="12" text-anchor="middle" fill="#8d96a0"></text><g class="trigger" data-node="analyst" role="button" tabindex="0" aria-label="Run a query: play Self-serve query" data-plays="query"><rect class="btnbg" x="642" y="83" width="132" height="34" rx="10" fill="#e6edf3"/><path class="btnicon" d="M658.13 93l11 7-11 7z" fill="#0d1117"/><text class="btntext" x="717" y="104.5" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">Run a query</text></g><g data-badges="query"><rect class="badge" x="664" y="-40" width="20" height="20" rx="10" fill="#e6edf3"/><text class="badget" x="674" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text></g></g><g class="node" id="n-api" data-id="api"><g class="tile" transform="translate(-26 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 16c-5 0-6 3-6 7v4c0 3-2 5-5 5 3 0 5 2 5 5v4c0 4 1 7 6 7"/><path d="M40 16c5 0 6 3 6 7v4c0 3 2 5 5 5-3 0-5 2-5 5v4c0 4-1 7-6 7"/></g></g><text class="ntitle" x="0" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Metrics API</text></g><g class="node" id="n-warehouse" data-id="warehouse"><g class="tile" transform="translate(201 -31) scale(0.81)" opacity=".55"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="6"/><path d="M16 18v28c0 3.3 7.2 6 16 6s16-2.7 16-6V18"/><path d="M16 32c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></g><g class="tile" transform="translate(196 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill=