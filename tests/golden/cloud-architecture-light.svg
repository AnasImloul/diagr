<title id="cloud-architecture-light-title">Job pipeline</title>
<desc id="cloud-architecture-light-desc">The API admits jobs into a fair backlog. A dispatcher releases them to the jobs queue, where workers pick them up; jobs that keep failing move to a dead-letter queue and can be redriven.</desc>
