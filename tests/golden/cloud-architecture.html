<title>Job pipeline</title>
<style>

:root[data-theme="dark"] { --bg: #0d1117; --text: #e6edf3; --muted: #8d96a0; --line: #8d96a0; --rule: #30363d; --hover: #151b23; --accent: #2bb59a; --on-accent: #ffffff; --fail: #f85149; --new: #a371f7; --changed: #d29922; --button: #e6edf3; --on-button: #0d1117; --badge: #e6edf3; --on-badge: #0d1117; --tone-neutral-fill: #151b23; --tone-neutral-stroke: #3d444d; --tone-blue-fill: #0f1824; --tone-blue-stroke: #3a8dde; --tone-teal-fill: #0f1b19; --tone-teal-stroke: #2bb59a; --tone-green-fill: #0f1a12; --tone-green-stroke: #3fb950; --tone-violet-fill: #16121f; --tone-violet-stroke: #8a63d2; --tone-amber-fill: #1a1608; --tone-amber-stroke: #d4a72c; --tone-orange-fill: #1c1410; --tone-orange-stroke: #f38020; --tile-blue-0: #0a5cb8; --tile-blue-1: #2e8bf0; --tile-teal-0: #0f7b6c; --tile-teal-1: #2bb59a; --tile-green-0: #0b5f55; --tile-green-1: #1fa38a; --tile-violet-0: #6a3fc4; --tile-violet-1: #a07be8; --tile-amber-0: #c9970a; --tile-amber-1: #f2c811; --tile-orange-0: #c2410c; --tile-orange-1: #f38020; --tile-slate-0: #475569; --tile-slate-1: #94a3b8; --tile-red-0: #b42318; --tile-red-1: #ef4444; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
.wrap { max-width: var(--page-width); margin: 0 auto; padding: 8px 0 40px; }

#toggle { position: fixed; top: 20px; right: 20px; z-index: 5; width: 40px; height: 40px; display: grid; place-items: center;
  padding: 0; cursor: pointer; color: var(--text); background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; }
#toggle:hover { background: var(--hover); }
#toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="light"] #toggle .sun, :root[data-theme="dark"] #toggle .moon { display: none; }
#toggle:focus-visible, .controls button:focus-visible, .trigger:focus-visible .btnbg { outline: 2px solid var(--text); outline-offset: 2px; }

svg.diagr { display: block; width: 100%; height: auto; }
svg.diagr .rot, svg.diagr .glyph { transform-box: fill-box; transform-origin: center; }
svg.diagr .node, svg.diagr .edge, svg.diagr .elab, svg.diagr .grp { transition: opacity 300ms; }
svg.diagr [data-hidden="1"] { opacity: 0; pointer-events: none; }

.edge .flow { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
.edge .head-ok { opacity: 0; }
.edge[data-status="drawn"] .flow { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset var(--dur, 700ms) ease-in-out; }
.edge[data-status="drawn"] .head-ok { opacity: 1; transition: opacity 120ms linear var(--dur, 700ms); }

.node .ring { opacity: 0; }
.node[data-status="active"] .ring { opacity: 1; animation: dg-pulse 1.2s ease-in-out infinite; }
.node[data-status="failed"] .ring { opacity: 1; stroke: var(--fail); }
.node .st { opacity: 0; transition: opacity 200ms; }
.node[data-status="active"] .st-spin, .node[data-status="done"] .st-done, .node[data-status="failed"] .st-fail { opacity: 1; }
.node[data-status="active"] .st-spin .rot, .node[data-status="active"] .glyph.spins, .node[data-spin] .glyph,
.trigger[aria-disabled="true"] .btnbusy .rot { animation: dg-rotate 1s linear infinite; }
.node[data-status="active"] .glyph.spins { animation-duration: 1.4s; }

.cell { transition: fill 200ms, stroke 200ms; }
.cell[data-status="act"] { fill: var(--accent); fill-opacity: .3; stroke: var(--accent); stroke-opacity: 1; animation: dg-pulse .9s ease-in-out infinite; }
.cell[data-status="ok"] { fill: var(--accent); stroke: var(--accent); stroke-opacity: 1; }
.cell[data-status="fail"] { fill: var(--fail); stroke: var(--fail); stroke-opacity: 1; }

svg.running .node:not(.junction):not([data-status]) { opacity: .35; }
svg.running .edge:not([data-status]), svg.running .elab:not([data-status]) { opacity: .25; }
svg.focusing .node:not([data-focused]), svg.focusing .edge:not([data-focused]), svg.focusing .elab:not([data-focused]) { opacity: .2; }

.trigger { cursor: pointer; }
.trigger:hover .btnbg { opacity: .88; }
.trigger .btnbusy { display: none; }
.trigger[aria-disabled="true"] { cursor: default; }
.trigger[aria-disabled="true"] .btnicon { display: none; }
.trigger[aria-disabled="true"] .btnbusy { display: inline; }
.trigger[aria-disabled="true"] .btnbg { opacity: .35; }

.seeking, .seeking * { transition: none !important; }

@keyframes dg-pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .25; } }
@keyframes dg-rotate { to { transform: rotate(360deg); } }

.panel { padding: 0 20px; }
.scenarios { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.scenarios button { height: 32px; padding: 0 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; }
.scenarios button:hover { color: var(--text); background: var(--hover); }
.scenarios button[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }
.scenarios button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 400ms ease; }
.row { display: flex; align-items: center; gap: 16px; margin: 10px 0 24px; flex-wrap: wrap; }
#status { flex: 1 1 260px; font-size: 14px; color: var(--muted); min-height: 1.4em; }
.controls { display: flex; align-items: center; gap: 6px; }
.controls button { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; cursor: pointer;
  color: var(--text); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; }
.controls button:hover { background: var(--hover); }
.controls button svg { width: 16px; height: 16px; fill: currentColor; }
.controls .pause, .controls[data-playing="1"] .play { display: none; }
.controls[data-playing="1"] .pause { display: block; }
#scrub { width: 160px; accent-color: var(--accent); }
#speed { height: 32px; color: var(--text); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 0 6px; }

ol.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 56px; }
ol.steps[hidden] { display: none; }
ol.steps li { display: flex; gap: 12px; align-items: flex-start; opacity: .55; transition: opacity 300ms; cursor: pointer; }
ol.steps li.active, ol.steps li.done, .idle ol.steps li { opacity: 1; }
ol.steps h3 { margin: 0 0 3px; font-size: 14px; }
ol.steps h3 button { all: unset; cursor: pointer; }
ol.steps h3 button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 2px; }
ol.steps p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
ol.steps .num { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px;
  font-size: 11px; font-weight: 600; background: var(--badge); color: var(--on-badge); }
ol.steps li.active .num { background: var(--accent); color: var(--on-accent); animation: dg-fade 1.2s ease-in-out infinite; }
ol.steps li.done .num { background: var(--accent); color: var(--on-accent); }
@keyframes dg-fade { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (max-width: 800px) { ol.steps { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) {
  svg.diagr *, ol.steps .num { animation: none !important; }
  svg.diagr *, .bar i, ol.steps li { transition: none !important; }
}

.p-fill-accent { fill: var(--accent); }
.p-fill-bg { fill: var(--bg); }
.p-fill-fail { fill: var(--fail); }
.p-fill-line { fill: var(--line); }
.p-fill-muted { fill: var(--muted); }
.p-fill-text { fill: var(--text); }
.p-stop-color-tile-blue-0 { stop-color: var(--tile-blue-0); }
.p-stop-color-tile-blue-1 { stop-color: var(--tile-blue-1); }
.p-stop-color-tile-orange-0 { stop-color: var(--tile-orange-0); }
.p-stop-color-tile-orange-1 { stop-color: var(--tile-orange-1); }
.p-stop-color-tile-slate-0 { stop-color: var(--tile-slate-0); }
.p-stop-color-tile-slate-1 { stop-color: var(--tile-slate-1); }
.p-stop-color-tile-violet-0 { stop-color: var(--tile-violet-0); }
.p-stop-color-tile-violet-1 { stop-color: var(--tile-violet-1); }
.p-stroke-accent { stroke: var(--accent); }
.p-stroke-line { stroke: var(--line); }
svg.diagr[data-scenario="job"] [data-badges]:not([data-badges="job"]) { display: none; }
</style>

<script>

  var sc, frames, steps, N, states, items = [];
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

      speedEl = document.getElementById("speed"), triggers = svg.querySelectorAll(".trigger");

          var start = e.getAttribute("data-hidden0");

    if (fill) fill.style.width = (N ? k / N * 100 : 0) + "%";

  }

  if (controls) controls.addEventListener("click", function (e) {
