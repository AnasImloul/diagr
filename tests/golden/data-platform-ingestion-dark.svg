<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -147 724 793" width="724" height="793" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="data-platform-ingestion-dark-title" aria-describedby="data-platform-ingestion-dark-desc">
<title id="data-platform-ingestion-dark-title">Ingestion</title>
<desc id="data-platform-ingestion-dark-desc">Three source feeds are ingested, validated and merged into a lakehouse, where a batch engine cleans and curates the data through bronze, silver and gold zones before a warehouse serves it to dashboards and an API. Four scenarios: the nightly batch, a bad record, a self-serve query and a backfill.</desc>
