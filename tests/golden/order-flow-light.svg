<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -145 1104 606.3" width="1104" height="606.3" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="order-flow-light-title" aria-describedby="order-flow-light-desc">
<title id="order-flow-light-title">Order processing</title>
<desc id="order-flow-light-desc">A web app posts an order to the API, which queues it for workers that write it to the orders database.</desc>
<defs><linearGradient id="tile-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a5cb8"/><stop offset="1" stop-color="#2e8bf0"/></linearGradient><linearGradient id="tile-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#f38020"/></linearGradient><linearGradient id="tile-slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#94a3b8"/></linearGradient><linearGradient id="tile-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3fc4"/><stop offset="1" stop-color="#a07be8"/></linearGradient></defs>
<rect x="-108" y="-145" width="1104" height="606.3" fill="#ffffff"/>
<g class="dg-body"><g class="grp" data-id="front" id="g-front"><rect x="-88" y="-125" width="176" height="286" rx="12" stroke-width="1.5" fill="#f1f6fd" stroke="#2e8bf0"/><text class="gtitle" x="-72" y="145" font-size="15" font-weight="600" fill="#1f2328">Frontend</text></g><g class="grp" data-id="back" id="g-back"><rect x="226" y="-125" width="750" height="399.3" rx="12" stroke-width="1.5" fill="#f1fbf8" stroke="#1fa38a"/><text class="gtitle" x="242" y="258.3" font-size="15" font-weight="600" fill="#1f2328">Backend<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#656d76">one region</tspan></text></g><g class="edge" id="e-web-_api" data-id="web-&gt;api" data-from="web" data-to="api"><path class="base" d="M30 0 L284 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M285 0L274.5 5.25L274.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-api-_queue" data-id="api-&gt;queue" data-from="api" data-to="queue"><path class="base" d="M344 0 L494 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M495 0L484.5 5.25L484.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-queue-_worker" data-id="queue-&gt;worker" data-from="queue" data-to="worker"><path class="base" d="M554 0 L700 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M701 0L690.5 5.25L690.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-worker-_db" data-id="worker-&gt;db" data-from="worker" data-to="db"><path class="base" d="M760 0 L858 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M859 0L848.5 5.25L848.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-queue-_dlq" data-id="queue-&gt;dlq" data-from="queue" data-to="dlq"><path class="base" d="M524 50 L524 121.3" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#57606a"/><path class="head" d="M524 122.3L518.75 111.8L529.25 111.8z" fill="#57606a"/></g><g class="labels"><g class="elab" data-edge="web-&gt;api"><rect x="115.28" y="-9" width="83.44" height="18" rx="4" fill="#ffffff"/><text class="elabel" x="157" y="4" font-size="12" text-anchor="middle" fill="#656d76">POST /orders</text></g><g class="elab" data-edge="api-&gt;queue"><rect x="390.61" y="-9" width="56.79" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="419" y="4" font-size="12" text-anchor="middle" fill="#656d76">enqueue</text></g><g class="elab" data-edge="queue-&gt;worker"><rect x="603.63" y="-9" width="46.73" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="627" y="4" font-size="12" text-anchor="middle" fill="#656d76">deliver</text></g><g class="elab" data-edge="worker-&gt;db"><rect x="790.84" y="-9" width="36.33" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="809" y="4" font-size="12" text-anchor="middle" fill="#656d76">write</text></g><g class="elab" data-edge="queue-&gt;dlq"><rect x="487.78" y="76.65" width="72.44" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="524" y="89.65" font-size="12" text-anchor="middle" fill="#656d76">after 3 tries</text></g></g><g class="node" id="n-web" data-id="web"><g class="tile" transform="translate(-26 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-slate)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="40" height="36" rx="4"/><path d="M12 24h40M18 19h.01M23 19h.01M28 19h.01"/></g></g><text class="ntitle" x="0" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Web app</text><text class="nsub" x="0" y="62" font-size="12" text-anchor="middle" fill="#656d76">checkout page</text><g class="trigger" data-node="web" role="button" tabindex="0" aria-label="Place order: play the scenario" data-plays="main"><rect class="btnbg" x="-66" y="83" width="132" height="34" rx="10" fill="#1f2328"/><path class="btnicon" d="M-47.93 93l11 7-11 7z" fill="#ffffff"/><text class="btntext" x="9" y="104.5" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Place order</text></g><g data-badges="main"><rect class="badge" x="-44" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="-34" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text></g></g><g class="node" id="n-api" data-id="api"><g class="tile" transform="translate(288 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-orange)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 14h7l17 36h5"/><path d="M33 31 22 50"/></g></g><text class="ntitle" x="314" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">API</text><text class="nsub" x="314" y="62" font-size="12" text-anchor="middle" fill="#656d76">validates</text><g data-badges="main"><rect class="badge" x="270" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="280" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text></g></g><g class="node" id="n-queue" data-id="queue"><g class="tile" transform="translate(498 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="22" width="44" height="20" rx="4"/><path d="M21 22v20M32 22v20M43 22v20"/></g></g><text class="ntitle" x="524" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Order queue</text></g><g class="node" id="n-worker" data-id="worker"><g class="tile" transform="translate(714 -36) scale(0.81)" opacity=".55"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><g class="tile" transform="translate(709 -31) scale(0.81)" opacity=".55"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><g class="tile" transform="translate(704 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><text class="ntitle" x="730" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Workers</text><text class="nsub" x="730" y="62" font-size="12" text-anchor="middle" fill="#656d76">three replicas</text><g data-badges="main"><rect class="badge" x="686" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="696" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text></g></g><g class="node" id="n-db" data-id="db"><g class="tile" transform="translate(862 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="6"/><path d="M16 18v28c0 3.3 7.2 6 16 6s16-2.7 16-6V18"/><path d="M16 32c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></g><text class="ntitle" x="888" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Orders</text></g><g class="node" id="n-dlq" data-id="dlq" data-mark="new"><g class="tile" transform="translate(498 125.3) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="22" width="44" height="20" rx="4"/><path d="M21 22v20M32 22v20M43 22v20"/></g></g><text class="ntitle" x="524" y="197.3" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Dead letters</text><text class="mark" x="570.57" y="196.3" font-size="9" font-weight="700" letter-spacing=".04em" fill="#8250df">NEW</text><text class="nsub" x="524" y="213.3" font-size="12" text-anchor="middle" fill="#656d76">kept for 14 days</text></g></g>
<line x1="-88" y1="294.3" x2="976" y2="294.3" stroke-width="1.5" stroke="#d0d7de"/>
<circle cx="-78" cy="324.3" r="10" fill="#1f2328"/>
<text x="-78" y="328.1" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="-58" y="328.3" font-size="14" font-weight="600" fill="#1f2328">Submit</text>
<text x="-58" y="347.3" font-size="12.5" fill="#656d76">The customer places the order from the checkout page.</text>
<circle cx="-78" cy="382.3" r="10" fill="#1f2328"/>
<text x="-78" y="386.1" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="-58" y="386.3" font-size="14" font-weight="600" fill="#1f2328">Validate and queue</text>
<text x="-58" y="405.3" font-size="12.5" fill="#656d76">The API checks the order and puts it on the queue, so a slow worker never blocks</text>
<text x="-58" y="422.3" font-size="12.5" fill="#656d76">checkout.</text>
<circle cx="474" cy="324.3" r="10" fill="#1f2328"/>
<text x="474" y="328.1" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="494" y="328.3" font-size="14" font-weight="600" fill="#1f2328">Process</text>
<text x="494" y="347.3" font-size="12.5" fill="#656d76">A worker takes the order off the queue and writes it to the database.</text>
<circle cx="474" cy="382.3" r="10" fill="#1f2328"/>
<text x="474" y="386.1" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<text x="494" y="386.3" font-size="14" font-weight="600" fill="#1f2328">Confirm</text>
<text x="494" y="405.3" font-size="12.5" fill="#656d76">Once the order is stored, the worker sends the confirmation email.</text>
</svg>
