<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -145 1016 608" width="1016" height="608" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-label="A web app posts an order to the API, which queues it for workers that write it to the orders database.">
<title>Order processing</title>
<defs><linearGradient id="tile-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a5cb8"/><stop offset="1" stop-color="#2e8bf0"/></linearGradient><linearGradient id="tile-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#f38020"/></linearGradient><linearGradient id="tile-slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#94a3b8"/></linearGradient><linearGradient id="tile-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3fc4"/><stop offset="1" stop-color="#a07be8"/></linearGradient></defs>
<rect x="-108" y="-145" width="1016" height="608" fill="#ffffff"/>
<g class="dg-body"><g class="grp" data-id="front" id="g-front"><rect x="-88" y="-125" width="176" height="401" rx="12" stroke-width="1.5" fill="#f1f6fd" stroke="#2e8bf0"/><text class="gtitle" x="-72" y="260" font-size="15" font-weight="600" fill="#1f2328">Frontend</text></g><g class="grp" data-id="back" id="g-back"><rect x="112" y="-125" width="776" height="401" rx="12" stroke-width="1.5" fill="#f1fbf8" stroke="#1fa38a"/><text class="gtitle" x="128" y="260" font-size="15" font-weight="600" fill="#1f2328">Backend<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#656d76">one region</tspan></text></g><g class="edge" id="e-web-_api" data-id="web-&gt;api" data-from="web" data-to="api"><path class="base" d="M30 0 L170 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M171 0L160.5 5.25L160.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-api-_queue" data-id="api-&gt;queue" data-from="api" data-to="queue"><path class="base" d="M230 0 L370 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M371 0L360.5 5.25L360.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-queue-_worker" data-id="queue-&gt;worker" data-from="queue" data-to="worker"><path class="base" d="M430 0 L570 0" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M571 0L560.5 5.25L560.5 -5.25z" fill="#57606a"/></g><g class="edge" id="e-worker-_db" data-id="worker-&gt;db" data-from="worker" data-to="db"><path class="base" d="M600 66 L600 140" fill="none" stroke-width="1.5" stroke="#57606a"/><path class="head" d="M600 141L594.75 130.5L605.25 130.5z" fill="#57606a"/></g><g class="edge" id="e-queue-_dlq" data-id="queue-&gt;dlq" data-from="queue" data-to="dlq"><path class="base" d="M400 50 L400 140" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#57606a"/><path class="head" d="M400 141L394.75 130.5L405.25 130.5z" fill="#57606a"/></g><g class="labels"><g class="elab" data-edge="web-&gt;api"><rect x="58.28" y="-9" width="83.44" height="18" rx="4" fill="#ffffff"/><text class="elabel" x="100" y="4" font-size="12" text-anchor="middle" fill="#656d76">POST /orders</text></g><g class="elab" data-edge="api-&gt;queue"><rect x="271.61" y="-9" width="56.79" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="300" y="4" font-size="12" text-anchor="middle" fill="#656d76">enqueue</text></g><g class="elab" data-edge="queue-&gt;worker"><rect x="476.63" y="-9" width="46.73" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="500" y="4" font-size="12" text-anchor="middle" fill="#656d76">deliver</text></g><g class="elab" data-edge="worker-&gt;db"><rect x="581.84" y="94" width="36.33" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="600" y="107" font-size="12" text-anchor="middle" fill="#656d76">write</text></g><g class="elab" data-edge="queue-&gt;dlq"><rect x="363.78" y="86" width="72.44" height="18" rx="4" fill="#f1fbf8"/><text class="elabel" x="400" y="99" font-size="12" text-anchor="middle" fill="#656d76">after 3 tries</text></g></g><g class="node" id="n-web" data-id="web"><g class="tile" transform="translate(-26 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-slate)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="40" height="36" rx="4"/><path d="M12 24h40M18 19h.01M23 19h.01M28 19h.01"/></g></g><text class="ntitle" x="0" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Web app</text><text class="nsub" x="0" y="62" font-size="12" text-anchor="middle" fill="#656d76">checkout page</text><g class="trigger" data-node="web" role="button" tabindex="0" aria-label="Place order: play the scenario" data-plays="order"><rect class="btnbg" x="-66" y="83" width="132" height="34" rx="10" fill="#1f2328"/><path class="btnicon" d="M-47.93 93l11 7-11 7z" fill="#ffffff"/><text class="btntext" x="9" y="104.5" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Place order</text></g><g data-badges="order"><rect class="badge" x="-44" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="-34" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text></g></g><g class="node" id="n-api" data-id="api"><g class="tile" transform="translate(174 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-orange)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 14h7l17 36h5"/><path d="M33 31 22 50"/></g></g><text class="ntitle" x="200" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">API</text><text class="nsub" x="200" y="62" font-size="12" text-anchor="middle" fill="#656d76">validates</text><g data-badges="order"><rect class="badge" x="156" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="166" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text></g></g><g class="node" id="n-queue" data-id="queue"><g class="tile" transform="translate(374 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="22" width="44" height="20" rx="4"/><path d="M21 22v20M32 22v20M43 22v20"/></g></g><text class="ntitle" x="400" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Order queue</text></g><g class="node" id="n-worker" data-id="worker"><g class="tile" transform="translate(584 -36) scale(0.81)" opacity=".55"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><g class="tile" transform="translate(579 -31) scale(0.81)" opacity=".55"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><g class="tile" transform="translate(574 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="15" rx="3"/><rect x="14" y="35" width="36" height="15" rx="3"/><path d="M21 21.5h.01M21 42.5h.01M30 21.5h12M30 42.5h12"/></g></g><text class="ntitle" x="600" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Workers</text><text class="nsub" x="600" y="62" font-size="12" text-anchor="middle" fill="#656d76">three replicas</text><g data-badges="order"><rect class="badge" x="556" y="-40" width="20" height="20" rx="10" fill="#1f2328"/><text class="badget" x="566" y="-26.2" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text></g></g><g class="node" id="n-db" data-id="db"><g class="tile" transform="translate(574 144) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="6"/><path d="M16 18v28c0 3.3 7.2 6 16 6s16-2.7 16-6V18"/><path d="M16 32c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></g><text class="ntitle" x="600" y="216" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Orders</text></g><g class="node" id="n-dlq" data-id="dlq" data-mark="new"><g class="tile" transform="translate(374 144) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="22" width="44" height="20" rx="4"/><path d="M21 22v20M32 22v20M43 22v20"/></g></g><text class="ntitle" x="400" y="216" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Dead letters</text><text class="mark" x="446.56" y="215" font-size="9" font-weight="700" letter-spacing=".04em" fill="#8250df">NEW</text><text class="nsub" x="400" y="232" font-size="12" text-anchor="middle" fill="#656d76">kept for 14 days</text></g></g>
<line x1="-88" y1="296" x2="888" y2="296" stroke-width="1.5" stroke="#d0d7de"/>
<circle cx="-78" cy="326" r="10" fill="#1f2328"/>
<text x="-78" y="329.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="-58" y="330" font-size="14" font-weight="600" fill="#1f2328">Submit</text>
<text x="-58" y="349" font-size="12.5" fill="#656d76">The customer places the order from the checkout page.</text>
<circle cx="-78" cy="384" r="10" fill="#1f2328"/>
<text x="-78" y="387.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="-58" y="388" font-size="14" font-weight="600" fill="#1f2328">Validate and queue</text>
<text x="-58" y="407" font-size="12.5" fill="#656d76">The API checks the order and puts it on the queue, so a slow worker never</text>
<text x="-58" y="424" font-size="12.5" fill="#656d76">blocks checkout.</text>
<circle cx="430" cy="326" r="10" fill="#1f2328"/>
<text x="430" y="329.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="450" y="330" font-size="14" font-weight="600" fill="#1f2328">Process</text>
<text x="450" y="349" font-size="12.5" fill="#656d76">A worker takes the order off the queue and writes it to the database.</text>
<circle cx="430" cy="384" r="10" fill="#1f2328"/>
<text x="430" y="387.8" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
<text x="450" y="388" font-size="14" font-weight="600" fill="#1f2328">Confirm</text>
<text x="450" y="407" font-size="12.5" fill="#656d76">Once the order is stored, the worker sends the confirmation email.</text>
</svg>
