<rect x="-86" y="-159" width="1246" height="893" fill="#0d1117"/>
<g class="dg-body"><g class="grp" data-id="a/region" id="g-a_region"><rect x="328" y="-139" width="812" height="325" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="344" y="170" font-size="15" font-weight="600" fill="#e6edf3">Region A<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#8d96a0">primary</tspan></text></g><g class="grp" data-id="b/region" id="g-b_region"><rect x="940" y="233" width="200" height="273" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="956" y="490" font-size="15" font-weight="600" fill="#e6edf3">Region B<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#8d96a0">standby</tspan></text></g><g class="grp" data-id="edge" id="g-edge"><rect x="112" y="65" width="176" height="221" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="128" y="270" font-size="15" font-weight="600" fill="#e6edf3">Global edge</text></g><g class="grp" data-id="a/cluster" id="g-a_cluster"><rect x="340" y="-127" width="600" height="273" rx="12" stroke-width="1.5" fill="#0f1824" stroke="#3a8dde"/><text class="gtitle" x="356" y="130" font-size="15" font-weight="600" fill="#e6edf3">Cluster</text></g><g class="grp" data-id="a/data" id="g-a_data"><rect x="952" y="-127" width="176" height="273" rx="12" stroke-width="1.5" fill="#1a1608" stroke="#d4a72c"/><text class="gtitle" x="968" y="130" font-size="15" font-weight="600" fill="#e6edf3">Data</text></g><g class="grp" data-id="b/data" id="g-b_data"><rect x="952" y="245" width="176" height="221" rx="12" stroke-width="1.5" fill="#1a1608" stroke="#d4a72c"/><text class="gtitle" x="968" y="450" font-size="15" font-weight="600" fill="#e6edf3">Data</text></g><g class="grp" data-id="a/checkout" id="g-a_checkout"><rect x="352" y="-115" width="376" height="221" rx="12" stroke-width="1.5" fill="#0f1b19" stroke="#2bb59a"/><text class="gtitle" x="368" y="90" font-size="15" font-weight="600" fill="#e6edf3">Checkout</text></g><g class="grp" data-id="a/catalog" id="g-a_catalog"><rect x="752" y="-115" width="176" height="221" rx="12" stroke-width="1.5" fill="#16121f" stroke="#8a63d2"/><text class="gtitle" x="768" y="90" font-size="15" font-weight="600" fill="#e6edf3">Catalog</text></g><g class="edge" id="e-user-_lb" data-id="user-&gt;lb" data-from="user" data-to="lb"><path class="base" d="M30 180 L170 180" fill="none" stroke-width="1.5" stroke="#8d96a0"/><path class="head" d="M171 180L160.5 185.25L160.5 174.75z" fill="#8d96a0"/></g><g class="edge" id="e-lb-_a_api" data-id="lb-&gt;a/api" data-from="lb" data-to="a/api"><path class="base" d="M230 180 L300 180 Q308 180 308 172 L308 20 Q308 12 316 12 L410 12" fill="none" stroke-width="1.5" stroke="#8d96a0"/><path class="head" d="M411 12L400.5 17.25L400.5 6.75z" fill="#8d96a0"/></g><g class="edge" id="e-a_db-_b_db" data-id="a/db-&gt;b/db" data-from="a/db" data-to="b/db"><path class="base" d="M1056 66 L1056 330" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#8d96a0"/><path class="head" d="M1056 331L1050.75 320.5L1061.25 320.5z" fill="#8d96a0"/></g><g class="edge" id="e-a_api-_a_worker" data-id="a/api-&gt;a/worker" data-from="a/api" data-to="a/worker"><path class="base" d="M470 0 L610 0" fill="none" stroke-width="1.5" stroke="#8d96a0"/><path class="head" d="M611 0L600.5 5.25L600.5 -5.25z" fill="#8d96a0"/></g><g class="edge" id="e-a_api-_a_prices" data-id="a/api-&gt;a/prices" data-from="a/api" data-to="a/prices"><path class="base" d="M440 -30 L440 -62 Q440 -70 448 -70 L832 -70 Q840 -70 840 -62 L840 -30" fill="none" stroke-width="1.5" stroke="#8d96a0"/><path class="head" d="M840 -29L834.75 -39.5L845.25 -39.5z" fill="#8d96a0"/></g><g class="edge" id="e-a_worker-_a_db" data-id="a/worker-&gt;a/db" data-from="a/worker" data-to="a/db"><path class="base" d="M640 66 L640 114 Q640 122 648 122 L932 122 Q940 122 940 114 L940 8 Q940 0 948 0 L1010 0" fill="none" stroke-width="1.5" stroke="#8d96a0"/><path class="head" d="M1011 0L1