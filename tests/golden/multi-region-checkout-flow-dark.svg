<line x1="-66" y1="315.5" x2="1688" y2="315.5" stroke-width="1.5" stroke="#30363d"/>
<circle cx="-56" cy="345.5" r="10" fill="#e6edf3"/>
<text x="-56" y="349.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text>
<text x="-36" y="349.5" font-size="14" font-weight="600" fill="#e6edf3">Request</text>
<text x="-36" y="368.5" font-size="12.5" fill="#8d96a0">The customer&#x27;s browser sends the order to the global load balancer.</text>
<circle cx="-56" cy="403.5" r="10" fill="#e6edf3"/>
<text x="-56" y="407.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">2</text>
<text x="-36" y="407.5" font-size="14" font-weight="600" fill="#e6edf3">Route to region A</text>
<text x="-36" y="426.5" font-size="12.5" fill="#8d96a0">Region A is active, so the load balancer sends the request there.</text>
<circle cx="-56" cy="461.5" r="10" fill="#e6edf3"/>
<text x="-56" y="465.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">3</text>
<text x="-36" y="465.5" font-size="14" font-weight="600" fill="#e6edf3">Price and accept</text>
<text x="-36" y="484.5" font-size="12.5" fill="#8d96a0">The checkout API asks the pricing service for the total, then queues the order for the workers.</text>
<circle cx="841" cy="345.5" r="10" fill="#e6edf3"/>
<text x="841" y="349.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">4</text>
<text x="861" y="349.5" font-size="14" font-weight="600" fill="#e6edf3">Persist</text>
<text x="861" y="368.5" font-size="12.5" fill="#8d96a0">A worker writes the order to the primary database.</text>
<circle cx="841" cy="403.5" r="10" fill="#e6edf3"/>
<text x="841" y="407.3" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">5</text>
<text x="861" y="407.5" font-size="14" font-weight="600" fill="#e6edf3">Replicate</text>
<text x="861" y="426.5" font-size="12.5" fill="#8d96a0">The write is replicated to region B, which stays ready to take over.</text>
</svg>
