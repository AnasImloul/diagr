ss="node" id="n-b_db" data-id="b/db"><g class="tile" transform="translate(1014 334) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="6"/><path d="M16 18v28c0 3.3 7.2 6 16 6s16-2.7 16-6V18"/><path d="M16 32c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></g><text class="ntitle" x="1040" y="406" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Orders</text><text class="nsub" x="1040" y="422" font-size="12" text-anchor="middle" fill="#8d96a0">replica</text><g data-badges="checkout"><rect class="badge" x="996" y="320" width="20" height="20" rx="10" fill="#e6edf3"/><text class="badget" x="1006" y="333.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">5</text></g></g><g class="node" id="n-lb" data-id="lb"><g class="tile" transform="translate(174 154) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="18"/><path d="M14 32h36M32 14c6 6 6 30 0 36M32 14c-6 6-6 30 0 36"/></g></g><text class="ntitle" x="200" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Load balancer</text><text class="nsub" x="200" y="242" font-size="12" text-anchor="middle" fill="#8d96a0">anycast</text><g data-badges="checkout"><rect class="badge" x="156" y="140" width="20" height="20" rx="10" fill="#e6edf3"/><text class="badget" x="166" y="153.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">2</text></g></g><g class="node" id="n-user" data-id="user"><g class="tile" transform="translate(-26 154) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-slate)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="40" height="36" rx="4"/><path d="M12 24h40M18 19h.01M23 19h.01M28 19h.01"/></g></g><text class="ntitle" x="0" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Customer</text><g class="trigger" data-node="user" role="button" tabindex="0" aria-label="Place order: play Checkout request" data-plays="checkout"><rect class="btnbg" x="-66" y="247" width="132" height="34" rx="10" fill="#e6edf3"/><path class="btnicon" d="M-47.93 257l11 7-11 7z" fill="#0d1117"/><text class="btntext" x="9" y="268.5" font-size="14" font-weight="600" text-anchor="middle" fill="#0d1117">Place order</text></g><g data-badges="checkout"><rect class="badge" x="-44" y="140" width="20" height="20" rx="10" fill="#e6edf3"/><text class="badget" x="-34" y="153.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text></g></g></g>
<line x1="-66" y1="526" x2="1140" y2="526" stroke-width="1.5" stroke="#30363d"/>
<circle cx="-56" cy="556" r="10" fill="#e6edf3"/>
<text x="-56" y="559.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text>
<text x="-36" y="560" font-size="14" font-weight="600" fill="#e6edf3">Request</text>
<text x="-36" y="579" font-size="12.5" fill="#8d96a0">The customer&#x27;s browser sends the order to the global load balancer.</text>
<circle cx="-56" cy="614" r="10" fill="#e6edf3"/>
<text x="-56" y="617.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">2</text>
<text x="-36" y="618" font-size="14" font-weight="600" fill="#e6edf3">Route to region A</text>
<text x="-36" y="637" font-size="12.5" fill="#8d96a0">Region A is active, so the load balancer sends the request there.</text>
<circle cx="-56" cy="672" r="10" fill="#e6edf3"/>
<text x="-56" y="675.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">3</text>
<text x="-36" y="676" font-size="14" font-weight="600" fill="#e6edf3">Price and accept</text>
<text x="-36" y="695" font-size="12.5" fill="#8d96a0">The checkout API asks the pricing service for the total, then queues the order for the workers.</text>
<circle cx="567" cy="556" r="10" fill="#e6edf3"/>
<text x="567" y="559.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">4</text>
<text x="587" y="560" font-size="14" font-weight="600" fill="#e6edf3">Persist</text>
<text x="587" y="579" font-size="12.5" fill="#8d96a0">A worker writes the order to the primary database.</text>
<circle cx="567" cy="614" r="10" fill="#e6edf3"/>
<text x="567" y="617.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">5</text>
<text x="587" y="618" font-size="14" font-weight="600" fill="#e6edf3">Replicate</text>
<text x="587" y="637" font-size="12.5" fill="#8d96a0">The write is replicated to region B, which stays ready to take over.</text>
</svg>
