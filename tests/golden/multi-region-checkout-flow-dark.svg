<rect x="-86" y="-159" width="1794" height="682.5" fill="#0d1117"/>
<g class="dg-body"><g class="grp" data-id="a/region" id="g-a_region"><rect x="442" y="-139" width="926" height="434.5" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="458" y="279.5" font-size="15" font-weight="600" fill="#e6edf3">Region A<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#8d96a0">primary</tspan></text></g><g class="grp" data-id="b/region" id="g-b_region"><rect x="1488" y="-17.5" width="200" height="273" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="1504" y="239.5" font-size="15" font-weight="600" fill="#e6edf3">Region B<tspan class="gsub" dx="8" font-size="12.5" font-weight="400" fill="#8d96a0">standby</tspan></text></g><g class="grp" data-id="edge" id="g-edge"><rect x="170" y="-59.5" width="176" height="221" rx="12" stroke-width="1.5" fill="#151b23" stroke="#3d444d"/><text class="gtitle" x="186" y="145.5" font-size="15" font-weight="600" fill="#e6edf3">Global edge</text></g><g class="grp" data-id="a/cluster" id="g-a_cluster"><rect x="454" y="-127" width="636" height="382.5" rx="12" stroke-width="1.5" fill="#0f1824" stroke="#3a8dde"/><text class="gtitle" x="470" y="239.5" font-size="15" font-weight="600" fill="#e6edf3">Cluster</text></g><g class="grp" data-id="a/data" id="g-a_data"><rect x="1180" y="-5.5" width="176" height="221" rx="12" stroke-width="1.5" fill="#1a1608" stroke="#d4a72c"/><text class="gtitle" x="1196" y="199.5" font-size="15" font-weight="600" fill="#e6edf3">Data</text></g><g class="grp" data-id="b/data" id="g-b_data"><rect x="1500" y="-5.5" width="176" height="221" rx="12" stroke-width="1.5" fill="#1a1608" stroke="#d4a72c"/><text class="gtitle" x="1516" y="199.5" font-size="15" font-weight="600" fill="#e6edf3">Data</text></g><g class="grp" data-id="a/checkout" id="g-a_checkout"><rect x="466" y="-59.5" width="338" height="275" rx="12" stroke-width="1.5" fill="#0f1b19" stroke="#2bb59a"/><text class="gtitle" x="482" y="199.5" font-size="15" font