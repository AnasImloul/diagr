<svg xmlns="http://www.w3.org/2000/svg" viewBox="-86 -159 1794 682.5" width="1794" height="682.5" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="multi-region-checkout-flow-dark-title" aria-describedby="multi-region-checkout-flow-dark-desc">
<title id="multi-region-checkout-flow-dark-title">Checkout request</title>
<desc id="multi-region-checkout-flow-dark-desc">A global load balancer sends traffic to region A, with region B on standby. Each region runs a cluster of services and its own database, kept in sync by replication. Three scenarios: a checkout request, a region failover and a rolling deploy.</desc>
