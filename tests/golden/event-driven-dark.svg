/g></g><text class="ntitle" x="774" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Session cache</text></g><g class="node" id="n-db" data-id="db"><g class="tile" transform="translate(748 134) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-blue)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="6"/><path d="M16 18v28c0 3.3 7.2 6 16 6s16-2.7 16-6V18"/><path d="M16 32c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></g><text class="ntitle" x="774" y="206" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Orders</text></g><g class="node" id="n-stock" data-id="stock"><g class="tile" transform="translate(1027.5 -26) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-amber)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 12 50 22v20L32 52 14 42V22z"/><path d="M14 22l18 10 18-10M32 32v20"/></g></g><text class="ntitle" x="1053.5" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Stock</text></g><g class="node" id="n-search" data-id="search"><g class="tile" transform="translate(1027.5 134) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-slate)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="12"/><path d="M37 37l13 13"/></g></g><text class="ntitle" x="1053.5" y="206" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Search index</text></g><g class="node" id="n-notify" data-id="notify"><g class="tile" transform="translate(1027.5 294) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-amber)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42V30a12 12 0 0 1 24 0v12l4 5H16z"/><path d="M28 51a4 4 0 0 0 8 0"/></g></g><text class="ntitle" x="1053.5" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Notifications</text></g><g class="node" id="n-gateway" data-id="gateway"><g class="tile" transform="translate(253.5 30) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 50V26l18-12 18 12v24"/><path d="M22 38h20M36 32l6 6-6 6"/></g></g><text class="ntitle" x="279.5" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">API gateway</text><text class="nsub" x="279.5" y="118" font-size="12" text-anchor="middle" fill="#8d96a0">auth, rate limits</text></g><g class="node" id="n-bus" data-id="bus"><g class="tile" transform="translate(748 294) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-violet)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 32h44"/><path d="M18 18v14M32 18v14M46 18v14M25 46V32M39 46V32"/><circle cx="18" cy="16" r="3"/><circle cx="32" cy="16" r="3"/><circle cx="46" cy="16" r="3"/><circle cx="25" cy="48" r="3"/><circle cx="39" cy="48" r="3"/></g></g><text class="ntitle" x="774" y="366" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Event bus</text><text class="nsub" x="774" y="382" font-size="12" text-anchor="middle" fill="#8d96a0">order.placed</text></g><g class="node" id="n-monitor" data-id="monitor"><g class="tile" transform="translate(1027.5 454) scale(0.81)"><rect width="64" height="64" rx="10" fill="url(#tile-teal)"/><g class="glyph" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="40" height="28" rx="3"/><path d="M26 50h12M32 42v8"/><path d="M18 31h6l4-7 6 12 4-5h8"/></g></g><text class="ntitle" x="1053.5" y="526" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Monitoring</text><text class="nsub" x="1053.5" y="542" font-size="12" text-anchor="middle" fill="#8d96a0">traces and alerts</text></g></g>
<line x1="-95.5" y1="566" x2="1230.2" y2="566" stroke-width="1.5" stroke="#30363d"/>
<circle cx="-85.5" cy="596" r="10" fill="#e6edf3"/>
<text x="-85.5" y="599.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">1</text>
<text x="-65.5" y="600" font-size="14" font-weight="600" fill="#e6edf3">Call the gateway</text>
<text x="-65.5" y="619" font-size="12.5" fill="#8d96a0">The phone app sends the order to the API gateway, which checks the token.</text>
<circle cx="-85.5" cy="654" r="10" fill="#e6edf3"/>
<text x="-85.5" y="657.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">2</text>
<text x="-65.5" y="658" font-size="14" font-weight="600" fill="#e6edf3">Store the order</text>
<text x="-65.5" y="677" font-size="12.5" fill="#8d96a0">The orders service reads the session from the cache and writes the order.</text>
<circle cx="597.35" cy="596" r="10" fill="#e6edf3"/>
<text x="597.35" y="599.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">3</text>
<text x="617.35" y="600" font-size="14" font-weight="600" fill="#e6edf3">Publish</text>
<text x="617.35" y="619" font-size="12.5" fill="#8d96a0">One event goes on the bus. The orders service is done; it does not wait for anyone.</text>
<circle cx="597.35" cy="654" r="10" fill="#e6edf3"/>
<text x="597.35" y="657.8" font-size="11" font-weight="600" text-anchor="middle" fill="#0d1117">4</text>
<text x="617.35" y="658" font-size="14" font-weight="600" fill="#e6edf3">React</text>
<text x="617.35" y="677" font-size="12.5" fill="#8d96a0">Each consumer picks the event up on its own.</text>
</svg>
