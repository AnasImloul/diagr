site_name: diagr
site_description: Declarative diagrams in YAML. Static SVG in light and dark, and a self-contained interactive HTML page.
site_url: https://anasimloul.github.io/diagr/
repo_url: https://github.com/AnasImloul/diagr
repo_name: AnasImloul/diagr

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system theme
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: diagr
          class: diagr
          format: !!python/name:diagr.markdown.fence
          validator: !!python/name:diagr.markdown.validate
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - tools/docs_hooks.py

extra_javascript:
  - javascripts/embeds.js
  - javascripts/anchors.js
  - javascripts/scheme-tabs.js
  - javascripts/playground.js

extra_css:
  - stylesheets/diagr.css

extra:
  generator: false

nav:
  - Home: index.md
  - Playground: playground.md
  - Reference:
      - Diagram format and effects: format.md
      - Themes and icons: themes-and-icons.md
      - Docs and CI: integrations.md
      - How diagr compares: comparison.md
  - Examples:
      - examples/index.md
      - Order processing: examples/order-flow.md
      - Cloud architecture: examples/cloud-architecture.md
      - Multi-region platform: examples/multi-region.md
      - Data platform: examples/data-platform.md
      - Event-driven shop: examples/event-driven.md
